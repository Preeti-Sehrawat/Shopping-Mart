<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
            <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  </head>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <body class="bg-gray-100 h-auto flex justify-center items-center">
    <div id="main-form" class="bg-white shadow-xl rounded-2xl p-8 w-[400px] max-w-full ">
      <div id="card-holder" class="mb-4 ">
        <label class="block font-semibold mb-2">Card Holder Name</label>
        <input
          type="text"
          id="card-holder-name"
          placeholder="John"
          class="w-full border rounded-lg p-2 "
        />
      </div>

      <div id="card-number" class="mb-4 ">
        <label class="block font-semibold mb-2">Card Number</label>
        <input
          type="text"
          id="card-Number"
          placeholder="123"
          class="border rounded-lg w-full p-3"
        />
      </div>
      <div id="Expiry" class="mb-4 ">
        <label class="block font-semibold mb-2">Expiry</label>
        <input
          type=text
          id="expiry"
          placeholder="MM/YY"
          class="border rounded-lg w-full p-3"
        />
      </div>
      <div id="CVV" class="mb-4 ">
        <label class="block font-semibold mb-2">CVV</label>
        <input
          type="password"
          id="cvv"
          placeholder="***"
          class="border rounded-lg w-full p-3"
        />
      </div>
      <div id="Error-msg" class=" invisible bg-red-200 text-red-500 p-1 mb-3 w-full h-10 ">
        <p>*Please fill out the details correctly.</p>
      </div>
          <div>
        <button id="pay-btn" class =" p-4 mb-6 font-semibold w-full  font-bold bg-blue-500"> Pay </button>
    </div>

<div id="Orders" class="w-[600px] mx-auto bg-white border border-slate-200 rounded-xl shadow-md p-6 mt-6">
  
  </div>
</div>


  
    <script src="payment.js"></script>
  </body>
</html>
